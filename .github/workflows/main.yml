name: Build Installer EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Inno Setup Script
      uses: disjoint/inno-setup-action@v6
      with:
        filepath: 'setup.iss'

    - name: Upload Output EXE
      uses: actions/upload-artifact@v4
      with:
        name: MSI_App_Player_X_HTHIENEXE_Setup
        path: Output/*.exe
